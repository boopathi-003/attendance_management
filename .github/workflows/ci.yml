name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Actions sets CI=true, which makes react-scripts promote every
        # ESLint warning to a build error. The codebase currently has a
        # number of unused imports and variables, so the build is forced
        # back to warning-only until those are cleaned up.
        env:
          CI: false
        run: npm run build

  # No test job yet: src/App.test.js is still the Create React App template
  # ("renders learn react link") and fails against the real App. Add a test
  # job once it is replaced with real tests.
